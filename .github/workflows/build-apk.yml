# APK / AAB 빌드
# 필요한 시크릿: KEYSTORE_PASSWORD, KEYSTORE_BASE64 (1번 워크플로로 만든 키)
name: 2. APK 빌드

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '버전 코드 (숫자, 업데이트할 때마다 1씩 올리기)'
        required: true
        default: '1'
      version_name:
        description: '버전 이름 (예: 1.0, 1.1)'
        required: true
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # Bubblewrap/안드로이드 빌드는 JDK 17 필요

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bubblewrap 설치 및 설정
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 서명 키 복원
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::KEYSTORE_BASE64 시크릿이 없습니다 (1번 워크플로 먼저)"; exit 1; fi
          echo "$KS_B64" | base64 -d > android.keystore

      - name: 버전 설정
        run: |
          cd android
          jq --argjson c ${{ github.event.inputs.version_code }} --arg n "${{ github.event.inputs.version_name }}" \
             '.appVersionCode=$c | .appVersionName=$n' twa-manifest.json > t.json && mv t.json twa-manifest.json
          cat twa-manifest.json

      - name: 안드로이드 프로젝트 생성 (twa-manifest.json 기준)
        run: |
          cd android
          bubblewrap update --skipVersionUpgrade

      - name: 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 서명
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias nr499es \
            --ks-pass env:KS_PW --key-pass env:KS_PW \
            --out out/NR499ES-v${{ github.event.inputs.version_name }}.apk out/aligned.apk
          rm out/aligned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/NR499ES-v${{ github.event.inputs.version_name }}.aab
          jarsigner -keystore android.keystore -storepass "$KS_PW" -keypass "$KS_PW" \
            out/NR499ES-v${{ github.event.inputs.version_name }}.aab nr499es

      - name: assetlinks.json 만들기 (주소창 없애기용)
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias nr499es -storepass "$KS_PW" | grep "SHA256:" | awk '{print $2}')
          PKG=$(jq -r .packageId android/twa-manifest.json)
          cat > out/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": { "namespace": "android_app", "package_name": "$PKG", "sha256_cert_fingerprints": ["$FP"] }
          }]
          JSON
          cat out/assetlinks.json

      - uses: actions/upload-artifact@v4
        with:
          name: NR499ES-v${{ github.event.inputs.version_name }}
          path: out/*
