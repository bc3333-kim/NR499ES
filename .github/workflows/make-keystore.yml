# 서명 키 만들기 (처음 한 번만 실행)
# 실행 전: Settings > Secrets and variables > Actions 에 KEYSTORE_PASSWORD 등록 (영문+숫자 12자 이상)
name: 1. 서명 키 만들기 (처음 한 번)

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 키 생성
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PW" ]; then echo "::error::KEYSTORE_PASSWORD 시크릿을 먼저 등록하세요"; exit 1; fi
          keytool -genkeypair -v -keystore android.keystore -alias nr499es \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PW" -keypass "$KS_PW" \
            -dname "CN=Narae Engineering, O=Narae Engineering, C=KR"
          base64 -w0 android.keystore > KEYSTORE_BASE64.txt
          keytool -list -v -keystore android.keystore -alias nr499es -storepass "$KS_PW" | grep "SHA256:"

      # 공개 저장소에서는 다른 사람도 내려받을 수 있으니 1일 뒤 자동 삭제
      # 내려받은 뒤 Actions 화면에서 직접 삭제하는 것을 권장
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-DELETE-AFTER-DOWNLOAD
          path: |
            android.keystore
            KEYSTORE_BASE64.txt
          retention-days: 1
